<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Test reCAPTCHA</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6LfMcJUrAAAAACBzu_hmDc74S0AaR612jFYxZM8K"></script>
</head>
<body>
  <h1>Générateur de token reCAPTCHA v3</h1>
  <button onclick="genererToken()">🎯 Générer un token</button>
  <p id="tokenResult" style="word-break: break-all; color: green; margin-top: 1em;"></p>

  <script>
    function genererToken() {
      grecaptcha.ready(function () {
        grecaptcha.execute('6LfMcJUrAAAAACBzu_hmDc74S0AaR612jFYxZM8K', { action: 'submit' })
          .then(function (token) {
            document.getElementById("tokenResult").textContent = "Token généré : " + token;
            console.log("Token :", token);
          });
      });
    }
  </script>
</body>
</html>
